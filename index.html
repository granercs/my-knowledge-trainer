<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F5EDE2"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>My Knowledge Trainer</title><style>
:root{--cream:#F5EDE2;--paper:#fffaf3;--ink:#473D35;--terra:#A35B43;--sage:#6B8069;--line:#e3d5c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:720px;margin:auto;padding:20px 16px 75px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 22px}h1{font:700 30px/1.15 Georgia,serif;margin:0}h2{font:700 25px/1.25 Georgia,serif;margin:4px 0 14px}h3{margin:0 0 9px;font-size:18px}.sub{color:#76685e;font-size:14px;margin-top:5px}.topnav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}button{font:inherit;cursor:pointer;border:1px solid #cbb8a9;background:var(--paper);border-radius:13px;padding:12px 15px;color:var(--ink);font-weight:600}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--terra);border-color:var(--terra);color:white}button.secondary{background:var(--sage);border-color:var(--sage);color:white}.topnav button{padding:9px 12px;font-size:14px}.topnav .selected{background:var(--ink);color:white}.panel,.topic,.subtopic{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:19px;margin-bottom:12px;box-shadow:0 3px 12px #473d3509}.topic,.subtopic{display:block;width:100%;text-align:left}.topic-title{font:700 21px Georgia,serif;display:flex;gap:12px;align-items:center}.topic-title span:first-child{font-size:26px}.muted{color:#786b61;font-size:14px}.progress{height:8px;border-radius:20px;background:#e9e0d6;overflow:hidden;margin-top:13px}.progress>div{height:100%;background:var(--sage);transition:width .2s}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:10px}.question{font:700 26px/1.4 Georgia,serif;margin:30px 0}.answer{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}.answer strong{display:block;font:700 24px/1.35 Georgia,serif;color:var(--terra)}.answer p{line-height:1.7}.pill{display:inline-block;background:#eee5d8;border-radius:40px;padding:5px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f3e8dc;border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}.library-item{border-bottom:1px solid var(--line);padding:10px 0}.library-item summary{cursor:pointer;font-weight:600}.library-item p{margin:8px 0}.notice{padding:12px 14px;border-left:4px solid var(--terra);background:#f7e8d9;border-radius:8px;margin-bottom:16px}input[type=file]{max-width:100%;margin:12px 0}footer{color:#85766a;font-size:12px;margin-top:25px}.small{font-size:13px}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.visual{width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin:10px 0}@media(max-width:400px){h1{font-size:26px}.question{font-size:23px}.shell{padding:14px 12px 60px}button{padding:11px 12px}}
</style></head><body><main class="shell"><header><div><h1>My Knowledge Trainer</h1><div class="sub">Mindennapi műveltség · saját tempóban</div></div><span style="font-size:30px">✦</span></header><nav id="nav" class="topnav"></nav><div id="root"></div><footer>Az adatok ebben a böngészőben tárolódnak. Készíts rendszeresen JSON biztonsági mentést; privát böngészés vagy böngészőadatok törlése elveszítheti őket.</footer></main><script>
const TOPICS=[["geo", "Földrajz", "🌍", [["cap", "Országok és fővárosok"], ["waters", "Kontinensek, tengerek, óceánok"], ["terrain", "Folyók, tavak, hegységek"], ["hungary", "Magyarország földrajza"], ["places", "Nevezetes földrajzi helyek"], ["flags", "Országzászlók"], ["countries", "Országismeret"], ["maps", "Térképes földrajz"]]], ["history", "Történelem", "🏛️", [["hun", "Magyar történelem"], ["people", "Magyar uralkodók és történelmi személyek"], ["world", "Világtörténelem"], ["eras", "Történelmi korszakok és összefüggések"]]], ["literature", "Irodalom", "📚", [["hunlit", "Magyar írók és költők"], ["worldlit", "Világirodalom"], ["works", "Híres művek és szerzőik"], ["periods", "Irodalmi korszakok és irányzatok"]]], ["art", "Képzőművészet", "🎨", [["paint", "Híres festők és festményeik"], ["hunart", "Magyar képzőművészek"], ["styles", "Művészeti korszakok és stílusok"], ["sculpt", "Híres szobrok és építészeti alkotások"]]], ["music", "Zene", "🎼", [["composers", "Klasszikus zeneszerzők és műveik"], ["hunmusic", "Magyar zeneszerzők és zenetörténet"], ["genres", "Zenei korszakok és műfajok"], ["opera", "Híres operák és zeneművek"]]], ["science", "Tudomány és általános ismeretek", "🔭", [["phys", "Fizika és kémia alapjai"], ["bio", "Biológia és az emberi test"], ["space", "Csillagászat és világűr"], ["discoveries", "Fontos felfedezések és feltalálók"], ["general", "Általános műveltségi érdekességek"], ["society", "Társadalmi és gazdasági ismeretek"]]]];
const BUILTIN=[{"id": "geo-cap-001", "topic": "geo", "sub": "cap", "q": "Mi Portugália fővárosa?", "a": "Lisszabon", "ex": "Lisszabon Portugália legnagyobb városa és politikai, kulturális központja. A Tejo folyó torkolatánál fekszik, az Atlanti-óceán közelében. A város a nagy földrajzi felfedezések korában különösen fontos kikötő volt.", "level": 1}, {"id": "geo-cap-002", "topic": "geo", "sub": "cap", "q": "Melyik ország fővárosa Varsó?", "a": "Lengyelország", "ex": "Varsó Lengyelország fővárosa és legnépesebb városa. A Visztula partján fekszik. Történelmi belvárosát a második világháború pusztításai után újjáépítették.", "level": 1}, {"id": "geo-cap-003", "topic": "geo", "sub": "cap", "q": "Mi Szlovénia fővárosa?", "a": "Ljubljana", "ex": "Ljubljana Szlovénia fővárosa és legnagyobb városa. A Ljubljanica folyó átszeli a történelmi központját. A város a Júliai-Alpok és az Adriai-tenger közötti térségben helyezkedik el.", "level": 2}, {"id": "geo-cap-004", "topic": "geo", "sub": "cap", "q": "Melyik ország fővárosa Reykjavík?", "a": "Izland", "ex": "Reykjavík Izland fővárosa, a világ egyik legészakibb fekvésű fővárosa. A sziget délnyugati részén található. Izland geotermikus energiáját a városi fűtésben is széles körben hasznosítják.", "level": 2}, {"id": "geo-waters-005", "topic": "geo", "sub": "waters", "q": "Melyik a Föld legnagyobb óceánja?", "a": "A Csendes-óceán", "ex": "A Csendes-óceán a Föld legnagyobb és legmélyebb óceánja. Ázsia és Ausztrália, illetve az amerikai kontinensek között terül el. Itt található a Mariana-árok, az óceánok legmélyebb ismert térsége.", "level": 1}, {"id": "geo-waters-006", "topic": "geo", "sub": "waters", "q": "Melyik tenger választja el Európát Afrikától?", "a": "A Földközi-tenger", "ex": "A Földközi-tenger Európa déli és Afrika északi partjai között fekszik. A Gibraltári-szoros köti össze az Atlanti-óceánnal. A térség az ókori civilizációk kereskedelmének és kultúrájának fontos központja volt.", "level": 1}, {"id": "geo-terrain-007", "topic": "geo", "sub": "terrain", "q": "Melyik Európa leghosszabb folyója?", "a": "A Volga", "ex": "A Volga Oroszország európai részén folyik, és a Kaszpi-tengerbe torkollik. Hossza mintegy 3500 kilométer. Jelentős szerepet játszik a hajózásban és az orosz történelemben.", "level": 2}, {"id": "geo-terrain-008", "topic": "geo", "sub": "terrain", "q": "Melyik hegységben található a Mont Blanc?", "a": "Az Alpokban", "ex": "A Mont Blanc az Alpok egyik legismertebb csúcsa, a francia–olasz határ térségében. Magassága a hó- és jégtakaró miatt kissé változik. Az Alpok több európai országon átnyúló hegységrendszer.", "level": 1}, {"id": "geo-hungary-009", "topic": "geo", "sub": "hungary", "q": "Melyik Magyarország legnagyobb tava?", "a": "A Balaton", "ex": "A Balaton Közép-Európa egyik legnagyobb tava, Magyarország nyugati részén található. Sekély vizének köszönhetően nyáron viszonylag gyorsan felmelegszik. A környező települések fontos turisztikai célpontok.", "level": 1}, {"id": "geo-places-010", "topic": "geo", "sub": "places", "q": "Melyik országban található Machu Picchu?", "a": "Peruban", "ex": "Machu Picchu az Andokban fekvő inka kori romváros. A 15. században épült, és ma az UNESCO világörökségi helyszíne. A magashegyi környezet és a teraszos építészet különösen ismertté tette.", "level": 2}, {"id": "history-hun-011", "topic": "history", "sub": "hun", "q": "Mikor volt a mohácsi csata?", "a": "1526. augusztus 29-én", "ex": "A magyar királyi sereg súlyos vereséget szenvedett az Oszmán Birodalom haderejétől. II. Lajos király a menekülés közben életét vesztette. A csata a középkori Magyar Királyság történetének egyik nagy fordulópontja volt.", "level": 1}, {"id": "history-hun-012", "topic": "history", "sub": "hun", "q": "Mikor kezdődött az 1848-as pesti forradalom?", "a": "1848. március 15-én", "ex": "A pesti forradalmárok a polgári átalakulást és a nemzeti önrendelkezést követelték. A tizenkét pont és a Nemzeti dal a nap jelképeivé váltak. Március 15. ma magyar nemzeti ünnep.", "level": 1}, {"id": "history-hun-013", "topic": "history", "sub": "hun", "q": "Mikor kezdődött az 1956-os magyar forradalom?", "a": "1956. október 23-án", "ex": "A budapesti diáktüntetés országos felkeléssé szélesedett. A résztvevők politikai szabadságot és a szovjet befolyás megszüntetését követelték. A forradalmat novemberben szovjet katonai beavatkozás verte le.", "level": 1}, {"id": "history-hun-014", "topic": "history", "sub": "hun", "q": "Mikor volt a nándorfehérvári diadal?", "a": "1456-ban", "ex": "Hunyadi János és Kapisztrán János seregei megvédték Nándorfehérvárt az oszmán ostromtól. A vár a Duna és a Száva találkozásánál állt. A győzelem jelentős időre megakasztotta az oszmán előrenyomulást ezen az útvonalon.", "level": 2}, {"id": "history-people-015", "topic": "history", "sub": "people", "q": "Ki volt Széchenyi István, és melyik században élt?", "a": "19. századi magyar politikus és reformer", "ex": "Széchenyi István (1791–1860) a magyar reformkor meghatározó alakja volt. Kezdeményezései között szerepelt a Magyar Tudós Társaság támogatása és a Lánchíd megépítésének előmozdítása. Gazdasági és közlekedési modernizációt szorgalmazott.", "level": 1}, {"id": "history-people-016", "topic": "history", "sub": "people", "q": "Ki volt Szent István király, és mikor uralkodott?", "a": "Magyarország első királya; körülbelül 1000/1001–1038 között uralkodott", "ex": "István a 10–11. század fordulóján élt. Királyságának megszervezése és a keresztény egyházi intézményrendszer kiépítése hosszú távon meghatározta az ország történetét. Augusztus 20. az államalapítás ünnepe.", "level": 1}, {"id": "history-world-017", "topic": "history", "sub": "world", "q": "Mikor ért véget a második világháború Európában?", "a": "1945. május 8-án", "ex": "A náci Németország feltétel nélküli kapitulációjának hatálybalépését Európa nagy részén május 8-án ünneplik. A második világháború azonban Ázsiában tovább folytatódott. A japán kapitulációt 1945 szeptemberében írták alá.", "level": 1}, {"id": "history-world-018", "topic": "history", "sub": "world", "q": "Melyik évben kezdődött a francia forradalom?", "a": "1789-ben", "ex": "A francia forradalom egyik jelképes eseménye a Bastille ostroma volt 1789. július 14-én. A forradalom megkérdőjelezte az abszolút monarchia és a rendi társadalom alapjait. Hatása egész Európában érezhetővé vált.", "level": 1}, {"id": "history-eras-019", "topic": "history", "sub": "eras", "q": "Melyik korszak követte Európában az ókort?", "a": "A középkor", "ex": "A középkor kezdetét gyakran a Nyugatrómai Birodalom 476-os bukásához kötik. A korszakhatárok történészi megállapodások, és térségenként eltérhetnek. A középkort a kora újkor követte.", "level": 1}, {"id": "history-eras-020", "topic": "history", "sub": "eras", "q": "Mit nevezünk reneszánsznak?", "a": "Az antik kultúra újjáéledését hangsúlyozó európai kulturális korszakot", "ex": "A reneszánsz Itáliában bontakozott ki a 14. századtól, és később Európa más részeire is átterjedt. Kiemelt figyelmet fordított az emberre, a természet megfigyelésére és az antik mintákra. Leonardo da Vinci és Michelangelo fontos alkotói voltak.", "level": 2}, {"id": "literature-hunlit-021", "topic": "literature", "sub": "hunlit", "q": "Melyik században élt Petőfi Sándor, és melyik korszakhoz tartozik?", "a": "A 19. században; a magyar romantika és reformkor költője", "ex": "Petőfi Sándor 1823-ban született, és 1849-ben tűnt el a szabadságharc idején. Költészetében a népiesség, a szabadság és a szerelem fontos témák. Ismert művei közé tartozik a Nemzeti dal és a János vitéz.", "level": 1}, {"id": "literature-hunlit-022", "topic": "literature", "sub": "hunlit", "q": "Ki volt Arany János, és melyik században alkotott?", "a": "19. századi magyar költő és műfordító", "ex": "Arany János a magyar elbeszélő költészet és balladaköltészet kiemelkedő alakja. A Toldi című elbeszélő költeménye tette széles körben ismertté. Petőfi Sándorral való barátsága a magyar irodalomtörténet fontos kapcsolata.", "level": 1}, {"id": "literature-hunlit-023", "topic": "literature", "sub": "hunlit", "q": "Melyik században élt Ady Endre, és miért jelentős?", "a": "A 19–20. század fordulóján élt, a modern magyar líra meghatározó költője", "ex": "Ady Endre 1877-ben született és 1919-ben halt meg. Költészetében újszerű szimbólumokat és erős társadalmi, személyes témákat használt. A Nyugat folyóirat első nemzedékének egyik meghatározó alakja volt.", "level": 2}, {"id": "literature-worldlit-024", "topic": "literature", "sub": "worldlit", "q": "Ki írta a Rómeó és Júliát?", "a": "William Shakespeare", "ex": "Shakespeare angol drámaíró és költő volt a 16–17. század fordulóján. A Rómeó és Júlia két veronai család viszályába ágyazott tragikus szerelmi történet. Művei ma is a világ színházi repertoárjának alapdarabjai.", "level": 1}, {"id": "literature-worldlit-025", "topic": "literature", "sub": "worldlit", "q": "Ki írta az Isteni színjátékot?", "a": "Dante Alighieri", "ex": "Dante a 13–14. században élt itáliai költő. Az Isteni színjáték a Poklon, a Purgatóriumon és a Paradicsomon vezet végig. A mű a középkori világszemlélet és az olasz irodalom egyik alapvető alkotása.", "level": 2}, {"id": "literature-worldlit-026", "topic": "literature", "sub": "worldlit", "q": "Ki írta a Bűn és bűnhődést?", "a": "Fjodor Mihajlovics Dosztojevszkij", "ex": "Az orosz író a 19. században alkotott. Regényének középpontjában Raszkolnyikov bűne, lelkiismerete és erkölcsi vívódása áll. Dosztojevszkij művei az emberi lélek összetettségét vizsgálják.", "level": 2}, {"id": "literature-works-027", "topic": "literature", "sub": "works", "q": "Ki írta Az ember tragédiáját?", "a": "Madách Imre", "ex": "Az ember tragédiája 1861-ben jelent meg. Drámai költeményében Ádám és Éva különböző történelmi korszakokon haladnak keresztül Lucifer vezetésével. A mű az emberi törekvések és a történelem értelmét vizsgálja.", "level": 1}, {"id": "literature-works-028", "topic": "literature", "sub": "works", "q": "Ki írta az Egri csillagokat?", "a": "Gárdonyi Géza", "ex": "Az Egri csillagok történelmi regény, amely az 1552-es egri várvédelem köré épül. Főszereplői között van Bornemissza Gergely és Cecey Éva. A regény a magyar ifjúsági irodalom egyik legismertebb alkotása.", "level": 1}, {"id": "literature-periods-029", "topic": "literature", "sub": "periods", "q": "Melyik irodalmi irányzatra jellemző az érzelmek és az egyéniség hangsúlyozása a 19. században?", "a": "A romantikára", "ex": "A romantika az érzelmeket, a képzeletet és a szabadság eszményét hangsúlyozta. Gyakran fordult a nemzeti múlt, a természet és a rendkívüli hősök felé. A magyar irodalomban Petőfi és Vörösmarty is kapcsolódik hozzá.", "level": 1}, {"id": "literature-periods-030", "topic": "literature", "sub": "periods", "q": "Mi volt a Nyugat?", "a": "1908-ban indult jelentős magyar irodalmi folyóirat", "ex": "A Nyugat a 20. századi magyar irodalmi modernség egyik legfontosabb fóruma volt. Szerzői között szerepelt Ady Endre, Babits Mihály és Kosztolányi Dezső. A lap 1941-ig jelent meg.", "level": 2}, {"id": "art-paint-031", "topic": "art", "sub": "paint", "q": "Ki festette a Mona Lisát?", "a": "Leonardo da Vinci", "ex": "A Mona Lisa a reneszánsz festészet egyik legismertebb portréja. Leonardo finom fény-árnyék átmeneteket, úgynevezett sfumatót alkalmazott. A festmény ma a párizsi Louvre gyűjteményében található.", "level": 1}, {"id": "art-paint-032", "topic": "art", "sub": "paint", "q": "Ki festette a Csillagos éj című képet?", "a": "Vincent van Gogh", "ex": "Van Gogh 1889-ben festette a Csillagos éjt. A kavargó égbolt és az erőteljes ecsetkezelés a mű jellegzetessége. A holland festő a posztimpresszionizmus egyik legismertebb alakja.", "level": 1}, {"id": "art-paint-033", "topic": "art", "sub": "paint", "q": "Ki festette a Guernicát?", "a": "Pablo Picasso", "ex": "Picasso 1937-ben alkotta a Guernicát a spanyol polgárháború idején. A monumentális festmény a háború borzalmait jeleníti meg. Fekete-fehér-szürke színvilága és töredezett formái különösen kifejezőek.", "level": 2}, {"id": "art-hunart-034", "topic": "art", "sub": "hunart", "q": "Ki festette a Krisztus Pilátus előtt című képet?", "a": "Munkácsy Mihály", "ex": "A festmény Munkácsy Krisztus-trilógiájának része. Munkácsy a 19. században alkotott, nemzetközi sikereket is elért. Nagyméretű történelmi és vallási kompozíciói különösen ismertek.", "level": 1}, {"id": "art-hunart-035", "topic": "art", "sub": "hunart", "q": "Ki festette a Magányos cédrust?", "a": "Csontváry Kosztka Tivadar", "ex": "Csontváry a 19–20. század fordulóján alkotott. A Magányos cédrus jelképes erejű, különleges színvilágú festmény. Művészete nehezen sorolható be egyetlen hagyományos irányzatba.", "level": 2}, {"id": "art-styles-036", "topic": "art", "sub": "styles", "q": "Mi jellemzi az impresszionista festészetet?", "a": "A fény és a pillanatnyi látvány megragadása, gyakran laza ecsetvonásokkal", "ex": "Az impresszionizmus a 19. század második felében bontakozott ki Franciaországban. Festői gyakran dolgoztak a szabadban, hogy megfigyeljék a változó fényviszonyokat. Claude Monet és Pierre-Auguste Renoir fontos képviselői.", "level": 1}, {"id": "art-styles-037", "topic": "art", "sub": "styles", "q": "Melyik korszakra jellemző a perspektíva tudatos használata és az antik minták újrafelfedezése?", "a": "A reneszánszra", "ex": "A reneszánsz művészek az emberi testet és a teret egyre pontosabban ábrázolták. A lineáris perspektíva szabályai különösen fontos szerepet kaptak. Leonardo, Raffaello és Michelangelo a korszak meghatározó mesterei.", "level": 1}, {"id": "art-styles-038", "topic": "art", "sub": "styles", "q": "Melyik irányzat használ gyakran geometrikus, több nézőpontot egyesítő formákat?", "a": "A kubizmus", "ex": "A kubizmus a 20. század elején alakult ki. Pablo Picasso és Georges Braque az ábrázolt tárgyakat egyszerűsített síkokra és formákra bontotta. A cél nem a hagyományos, egyetlen nézőpontból látott tér visszaadása volt.", "level": 2}, {"id": "art-sculpt-039", "topic": "art", "sub": "sculpt", "q": "Ki alkotta a Dávid című híres márványszobrot Firenzében?", "a": "Michelangelo", "ex": "Michelangelo Dávid-szobra a magas reneszánsz egyik legismertebb alkotása. A bibliai hőst a küzdelem előtti feszült pillanatban ábrázolja. A szobor az emberi anatómia és az arányok mesterszintű megfigyeléséről tanúskodik.", "level": 1}, {"id": "art-sculpt-040", "topic": "art", "sub": "sculpt", "q": "Melyik építészeti stílusra jellemzők a csúcsívek és a nagy színes üvegablakok?", "a": "A gótikára", "ex": "A gótikus építészet a középkori Európában bontakozott ki. A csúcsívek, támpillérek és bordás boltozatok magasabb, világosabb templomtereket tettek lehetővé. A párizsi Notre-Dame híres gótikus székesegyház.", "level": 1}, {"id": "music-composers-041", "topic": "music", "sub": "composers", "q": "Ki komponálta A négy évszakot?", "a": "Antonio Vivaldi", "ex": "Vivaldi a 17–18. század fordulóján élt velencei barokk zeneszerző. A négy évszak négy hegedűversenyből álló ciklus. A tételek hangfestő eszközökkel idézik fel az évszakok hangulatát.", "level": 1}, {"id": "music-composers-042", "topic": "music", "sub": "composers", "q": "Ki írta a 9. szimfóniát, amelynek zárótételében az Örömóda hangzik el?", "a": "Ludwig van Beethoven", "ex": "Beethoven a klasszika és a romantika határán alkotott. A 9. szimfóniát 1824-ben mutatták be. Zárótételében Schiller Örömódájának megzenésítése hangzik el, amelynek dallamát az Európai Unió himnuszaként is használják.", "level": 1}, {"id": "music-composers-043", "topic": "music", "sub": "composers", "q": "Melyik zeneszerző írta A varázsfuvola című operát?", "a": "Wolfgang Amadeus Mozart", "ex": "Mozart a 18. századi bécsi klasszika egyik legfontosabb zeneszerzője. A varázsfuvola 1791-ben került színre. A mű mesei és szimbolikus elemeket, valamint könnyen felismerhető dallamokat egyesít.", "level": 1}, {"id": "music-hunmusic-044", "topic": "music", "sub": "hunmusic", "q": "Ki komponálta a Háry János című daljátékot?", "a": "Kodály Zoltán", "ex": "Kodály a 20. századi magyar zenekultúra meghatározó alakja volt. Népzenekutatóként és zenepedagógusként is jelentős munkát végzett. A Háry János a magyar népzene hangzásvilágát is felhasználja.", "level": 1}, {"id": "music-hunmusic-045", "topic": "music", "sub": "hunmusic", "q": "Melyik magyar zeneszerző gyűjtött népdalokat Kodály Zoltánnal együtt?", "a": "Bartók Béla", "ex": "Bartók a 20. század egyik legjelentősebb zeneszerzője és népzenekutatója. Magyar és más népek dallamait is tudományos alapossággal gyűjtötte. Műveiben a népzenei hatásokat modern zeneszerzői nyelvvel kapcsolta össze.", "level": 1}, {"id": "music-genres-046", "topic": "music", "sub": "genres", "q": "Melyik zenei korszakhoz tartozik Johann Sebastian Bach?", "a": "A barokkhoz", "ex": "Bach 1685 és 1750 között élt. A barokk zene egyik legfontosabb alakja, különösen az ellenpont és a fúga mestere volt. Ismert művei közé tartoznak a brandenburgi versenyek és a Máté-passió.", "level": 1}, {"id": "music-genres-047", "topic": "music", "sub": "genres", "q": "Mit nevezünk szimfóniának a klasszikus zenében?", "a": "Általában zenekarra írt, többtételes nagyformát", "ex": "A szimfónia különösen a bécsi klasszika idején vált központi műfajjá. Gyakran négy tételből áll, de számos kivétel létezik. Haydn, Mozart és Beethoven jelentősen formálta a műfajt.", "level": 2}, {"id": "music-genres-048", "topic": "music", "sub": "genres", "q": "Melyik korszakra jellemző a basso continuo használata?", "a": "A barokkra", "ex": "A basso continuo a barokk zene jellegzetes kíséreti gyakorlata volt. Egy basszushangszer és rendszerint egy harmóniákat játszó hangszer alkotta. A barokk zenében fontos szerepet kapott a díszítés és a kontraszt.", "level": 2}, {"id": "music-opera-049", "topic": "music", "sub": "opera", "q": "Ki komponálta a Carmen című operát?", "a": "Georges Bizet", "ex": "A Carmen 1875-ben került színre Párizsban. Története Spanyolországban játszódik, és a szabadság, féltékenység és szenvedély témáit járja körül. A Habanera és a Toreádordal a legismertebb részletei.", "level": 1}, {"id": "music-opera-050", "topic": "music", "sub": "opera", "q": "Ki komponálta a Traviata című operát?", "a": "Giuseppe Verdi", "ex": "Verdi a 19. századi olasz opera meghatározó mestere. A Traviata Alexandre Dumas egyik műve nyomán született, és 1853-ban mutatták be. Központi szereplője Violetta Valéry.", "level": 2}, {"id": "science-phys-051", "topic": "science", "sub": "phys", "q": "Mi a víz kémiai képlete?", "a": "H₂O", "ex": "Egy vízmolekula két hidrogénatomból és egy oxigénatomból áll. A víz fontos oldószer és az élő szervezetek alapvető alkotója. A természetben szilárd, folyékony és légnemű halmazállapotban is előfordul.", "level": 1}, {"id": "science-phys-052", "topic": "science", "sub": "phys", "q": "Mi a gravitáció?", "a": "A tömeggel rendelkező testek közötti vonzó kölcsönhatás", "ex": "A gravitáció tartja pályán a Holdat a Föld körül és a bolygókat a Nap körül. A mindennapokban a testek súlyaként érzékeljük hatását. Newton klasszikus elméletét Einstein általános relativitáselmélete pontosította.", "level": 1}, {"id": "science-bio-053", "topic": "science", "sub": "bio", "q": "Melyik szerv pumpálja a vért az emberi testben?", "a": "A szív", "ex": "A szív izmos szerv, amely a vérkeringés fenntartásáért felel. Jobb és bal oldala eltérő keringési körökbe továbbítja a vért. A vér oxigént és tápanyagokat szállít a szövetekhez.", "level": 1}, {"id": "science-bio-054", "topic": "science", "sub": "bio", "q": "Mi a DNS fő szerepe?", "a": "Az örökítő információ tárolása", "ex": "A DNS a sejtek örökítőanyagának alapvető molekulája. Szerkezetét kettős spirálként szokás ábrázolni. A DNS szakaszai, a gének, fontos szerepet játszanak a fehérjék előállításának szabályozásában.", "level": 1}, {"id": "science-space-055", "topic": "science", "sub": "space", "q": "Melyik bolygó van legközelebb a Naphoz?", "a": "A Merkúr", "ex": "A Merkúr a Naprendszer legbelső bolygója. A Nap körüli keringési ideje mindössze körülbelül 88 földi nap. Felszínét sok becsapódási kráter borítja.", "level": 1}, {"id": "science-space-056", "topic": "science", "sub": "space", "q": "Mi a Tejútrendszer?", "a": "Az a galaxis, amelyhez a Naprendszer tartozik", "ex": "A Tejútrendszer csillagok, gáz, por és sötét anyag hatalmas rendszere. A Nap a galaxis egyik spirálkarjának környezetében helyezkedik el. Sötét égbolton a galaxis korongjának egy részét fényes sávként látjuk.", "level": 1}, {"id": "science-discoveries-057", "topic": "science", "sub": "discoveries", "q": "Ki fedezte fel a penicillin antibakteriális hatását 1928-ban?", "a": "Alexander Fleming", "ex": "Fleming megfigyelte, hogy egy penészgomba gátolta a baktériumok növekedését. A penicillin gyógyszerként történő kifejlesztésében később más kutatók, köztük Florey és Chain is kulcsszerepet játszottak. Az antibiotikumok alapvetően átalakították a fertőzések kezelését.", "level": 1}, {"id": "science-discoveries-058", "topic": "science", "sub": "discoveries", "q": "Ki dolgozta ki a mozgástörvények klasszikus rendszerét?", "a": "Isaac Newton", "ex": "Newton a 17. században fogalmazta meg a klasszikus mechanika alapvető törvényeit. Munkája a bolygómozgás és a földi mozgások közös leírásához vezetett. A modern fizika később megmutatta a klasszikus elmélet érvényességi határait.", "level": 1}, {"id": "science-general-059", "topic": "science", "sub": "general", "q": "Melyik díjat alapította Alfred Nobel a tudományos és más kiemelkedő teljesítmények elismerésére?", "a": "A Nobel-díjat", "ex": "Az első Nobel-díjakat 1901-ben adták át. Az eredeti kategóriák között szerepel a fizika, a kémia, az orvostudomány, az irodalom és a béke. A közgazdasági emlékdíjat később hozták létre.", "level": 1}, {"id": "science-society-060", "topic": "science", "sub": "society", "q": "Mi az ENSZ alapvető célja?", "a": "A nemzetközi béke és biztonság fenntartása, valamint az államok együttműködésének elősegítése", "ex": "Az Egyesült Nemzetek Szervezetét 1945-ben hozták létre. Fő szervei közé tartozik a Közgyűlés és a Biztonsági Tanács. Tevékenysége a humanitárius segítségnyújtásra és a nemzetközi jog fejlesztésére is kiterjed.", "level": 1}];

function pOf(c){return db.progress[c.id]||{step:-1,due:0,attempts:0,correct:0,fail:0}}

function nav(){const tabs=[["home","Témakörök"],["library","Tudástár"],["stats","Statisztika"],["manage","Adatok"]];$("nav").innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'selected':''}" data-nav="${id}">${label}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.nav))}

function subtopics(){const t=topic(selectedTopic);if(!t){go("home");return}let all=cardsFor(selectedTopic).filter(c=>inScope(c));$("root").innerHTML=`<button onclick="go('home')">← Témakörök</button><h2 style="margin-top:20px">${t[2]} ${esc(t[1])}</h2>${scopeSelect(scope,"setScope")}<label>Nehézség: <select onchange="setDifficulty('${selectedTopic}',this.value)">${[["auto","Automatikus"],["1","Alap"],["2","Közép"],["3","Haladó"]].map(([v,l])=>`<option value="${v}" ${difficulty(selectedTopic)===v?"selected":""}>${l}</option>`).join("")}</select></label><button class="subtopic" onclick="start('${selectedTopic}',null)"><h3>🔀 Teljes témakör vegyesen</h3><div class="muted">${all.length} kérdés · ${all.filter(due).length} esedékes</div></button>`+t[3].map(([s,name])=>{let a=cardsFor(selectedTopic,s).filter(c=>inScope(c));return `<button class="subtopic" onclick="start('${selectedTopic}','${s}')"><h3>${esc(name)}</h3><div class="muted">${a.length} kérdés · ${a.filter(due).length} esedékes</div></button>`}).join("")}
function start(t,s){selectedTopic=t;selectedSub=s;let arr=cardsFor(t,s).filter(eligible),dueCards=shuffle(arr.filter(due)).sort((a,b)=>pOf(b).fail-pOf(a).fail||pOf(a).due-pOf(b).due),freshCards=shuffle(arr.filter(c=>!studied(c)&&countNew(c.topic,c.sub)<limit(c.topic,c.sub))).sort((a,b)=>(tier(a)==='core'?0:1)-(tier(b)==='core'?0:1)||a.level-b.level);let chosen=[],i=0,j=0;while(i<dueCards.length||j<freshCards.length){if(chosen.length%10<7&&i<dueCards.length)chosen.push(dueCards[i++]);else if(j<freshCards.length){let c=freshCards[j++];if(chosen.filter(x=>x.sub===c.sub&&!studied(x)).length+countNew(c.topic,c.sub)<limit(c.topic,c.sub))chosen.push(c)}else if(i<dueCards.length)chosen.push(dueCards[i++]);else break}
if(!chosen.length){page="empty";render();return}
session={ids:chosen.map(c=>c.id),index:0,topic:t,sub:s,scope,free:false};shown=false;persistSession();page="practice";render()}
function resume(){session={...db.session};scope=session.scope||"core";selectedTopic=session.topic;selectedSub=session.sub;shown=!!session.shown;page="practice";render()}
function freeReview(){let a=shuffle(cardsFor(selectedTopic,selectedSub).filter(eligible));if(!a.length)return;session={ids:a.map(c=>c.id),index:0,topic:selectedTopic,sub:selectedSub,scope,free:true};shown=false;page="practice";render()}
function empty(){let t=selectedTopic,s=selectedSub,blocked=topic(t)[3].filter(([id])=>(!s||id===s)&&countNew(t,id)>=limit(t,id)&&cardsFor(t,id).some(c=>eligible(c)&&!studied(c)));$("root").innerHTML=`<section class="panel"><h2>${blocked.length?"Elérted a napi új kérdéskeretet":"Most nincs új vagy esedékes kérdés"}</h2>${blocked.map(([id,name])=>`<h3>${esc(name)}</h3><p>Ma ${countNew(t,id)} új kérdés.</p><div class="row"><button class="primary" onclick="extend('${t}','${id}',5)">További 5 új kérdés</button><button onclick="extend('${t}','${id}',10)">További 10 új kérdés</button></div>`).join("")}<p>A szabad gyakorlás nem módosítja az ismétlési ütemezést.</p><div class="row"><button onclick="freeReview()">Szabad gyakorlás</button><button onclick="selectTopic('${t}')">${blocked.length?"Mára nem kérek több új kérdést":"Vissza"}</button></div></section>`}
function current(){return db.cards.find(c=>c.id===session?.ids[session.index])}
function practice(){const c=current();if(!c){finish();return}if(!inScope(c)){session.index++;shown=false;persistSession();practice();return}if(!session.free&&!studied(c)&&countNew(c.topic,c.sub)>=limit(c.topic,c.sub)){session.index++;shown=false;persistSession();practice();return}let pr=pOf(c),status=session.free?"Szabad gyakorlás":!studied(c)?"Új kérdés":"Ismétlés";$("root").innerHTML=`<section class="panel"><div class="row between"><span class="pill">${esc(subName(c.topic,c.sub))}</span><span class="muted">${session.index+1} / ${session.ids.length}</span></div><div class="row" style="margin-top:9px"><span class="muted">${["","Alap","Közép","Haladó"][c.level]||"Alap"} · ${status} · ${tier(c)==='core'?'Törzsanyag':'Bővített'}</span></div><div class="progress"><div style="width:${100*session.index/session.ids.length}%"></div></div><div class="question">${esc(c.q)}</div>${c.image?`<img class="visual" src="${esc(c.image)}" alt="A kérdéshez tartozó kép">`:""}${shown?`<div class="answer"><div class="muted">Válasz</div><strong>${esc(c.a)}</strong>${c.ex&&!(c.topic==="geo"&&c.sub==="cap")?`<h3 style="margin-top:20px">Háttér és összefüggések</h3><p>${esc(c.ex)}</p>`:""}<div class="stack">${session.free?`<button class="secondary" onclick="nextFree()">Következő kérdés</button>`:`<button class="primary" onclick="rate(true)">Tudtam!</button><button onclick="rate(false)">Még gyakorolnom kell</button>`}</div></div>`:`<button class="primary" onclick="shown=true;persistSession();render()">Válasz megmutatása</button>`}${tierButton(c)}</section><button onclick="exitPractice()">Kilépés a gyakorlásból</button>`}
function persistSession(){if(session&&!session.free){db.session={...session,shown};save()}}
function rate(ok){let c=current();if(!c||!shown||session.free)return;let pr=pOf(c),wasNew=!studied(c);if(wasNew)registerNew(c);pr.attempts++;if(ok){pr.correct++;pr.step=Math.min(STEPS.length-1,pr.step+1);pr.due=Date.now()+STEPS[pr.step]*DAY}else{pr.fail++;pr.step=-1;pr.due=Date.now()+5*60000}db.progress[c.id]=pr;session.index++;shown=false;persistSession();render()}

function validateCard(c){return c&&typeof c.id==="string"&&/^[a-z0-9_-]{3,80}$/.test(c.id)&&TOPICS.some(t=>t[0]===c.topic&&t[3].some(s=>s[0]===c.sub))&&typeof c.q==="string"&&c.q.trim()&&c.q.length<=400&&typeof c.a==="string"&&c.a.trim()&&c.a.length<=800&&typeof c.ex==="string"&&c.ex.length<=2500&&[1,2,3].includes(c.level)&&(!c.priority||["core","extra"].includes(c.priority))&&(!c.image||typeof c.image==="string"&&c.image.startsWith("data:image/")&&c.image.length<250000)}
async function loadFile(input,kind){let f=input.files[0];if(!f)return;try{if(f.size>5e6)throw Error("A fájl túl nagy (max. 5 MB).");let d=JSON.parse(await f.text());if(kind==="backup"){if(d.app!=="My Knowledge Trainer"||!d.data||!Array.isArray(d.data.cards)||!d.data.cards.every(validateCard)||!d.data.progress||typeof d.data.progress!=="object"||Array.isArray(d.data.progress))throw Error("Érvénytelen biztonsági mentés.");if(!confirm("A visszatöltés felülírja a jelenlegi tanulási adatokat. Folytatod?"))return;db=d.data;db.daily??={};db.session=null;db.lastBackup=Date.now();const ids=new Set(db.cards.map(c=>c.id));for(let c of BUILTIN)if(!ids.has(c.id))db.cards.push(c);save();alert("Sikeres visszatöltés.")}else{if(d.app!=="My Knowledge Trainer Questions"||!Array.isArray(d.cards)||d.cards.length<1||d.cards.length>500||!d.cards.every(validateCard))throw Error("Hibás kérdéscsomag. A formátum: app = My Knowledge Trainer Questions, cards = [...].");let ids=new Set(db.cards.map(c=>c.id)),added=0;for(let c of d.cards)if(!ids.has(c.id)){db.cards.push(c);ids.add(c.id);added++}save();alert(`${added} új kérdés hozzáadva. A meglévő haladás megmaradt.`)}go("home")}catch(e){alert("Nem sikerült beolvasni: "+e.message)}finally{input.value=""}}
function manage(){$("root").innerHTML=`<h2>Adatok és biztonsági mentés</h2>${backupHint()}<section class="panel"><h3>Teljes biztonsági mentés</h3><p>Letölthető JSON-fájl a kérdésekkel és a tanulási előzményekkel.</p><button class="primary" onclick="exportBackup()">Biztonsági mentés letöltése</button><h3 style="margin-top:24px">Biztonsági mentés visszatöltése</h3><p class="muted">A jelenlegi adatokat felülírja. Előtte érdemes új mentést készíteni.</p><input type="file" accept=".json,application/json" onchange="loadFile(this,'backup')"></section><section class="panel"><h3>Új kérdéscsomag hozzáadása</h3><p>A kérdések egyedi azonosító alapján kerülnek be; az ismétlődő azonosítókat kihagyjuk, a tanulási eredmények megmaradnak.</p><input type="file" accept=".json,application/json" onchange="loadFile(this,'cards')"><p class="muted small">Formátum: {"app":"My Knowledge Trainer Questions","cards":[{"id":"geo-cap-001","topic":"geo","sub":"cap","q":"Kérdés","a":"Válasz","ex":"Magyarázat","level":1}]}</p></section><section class="panel"><h3>Adatvédelem</h3><p class="muted">Nincs fiók, nincs szerveres szinkronizálás. Az alkalmazás a böngésző helyi tárhelyét használja. A mentéshez és importáláshoz fájlhozzáférés szükséges.</p></section>`}
function render(){nav();if(page==="home")home();else if(page==="subtopics")subtopics();else if(page==="practice")practice();else if(page==="empty")empty();else if(page==="library")library();else if(page==="stats")stats();else if(page==="manage")manage()}
save();render();
</script><script>
